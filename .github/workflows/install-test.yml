# Runs the real one-click installers on fresh GitHub-hosted Windows and macOS
# machines, ending with install/self_test.py (all three stages on synthetic data).
# This is the only automatic test of the Windows installer, so run it after any
# change to install/, INSTALL_*.{bat,sh}, tools/analyze_folder.py or the pins.
name: Installer test

on:
  workflow_dispatch:          # "Run workflow" button on the Actions tab
  pull_request:
    paths:
      - "install/**"
      - "INSTALL_WINDOWS.bat"
      - "INSTALL_MAC.sh"
      - "tools/analyze_folder.py"
      - "tools/batch_suite2p.py"
      - "pipeline/**"
      - ".github/workflows/install-test.yml"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: INSTALL_WINDOWS.bat must have Windows (CRLF) line endings
        shell: pwsh
        run: |
          $raw = [IO.File]::ReadAllText("INSTALL_WINDOWS.bat")
          if ($raw -notmatch "`r`n") { throw "INSTALL_WINDOWS.bat lost its CRLF line endings" }
      - name: Run the installer exactly as a user would (double-click = cmd)
        shell: cmd
        run: INSTALL_WINDOWS.bat < NUL
      - name: The installer must have finished and passed its self-test
        shell: pwsh
        run: |
          $log = Get-Content C:\CalciumPipeline\install_log.txt -Raw
          if ($log -notmatch "SELF-TEST PASSED") { Write-Output $log; throw "installer or self-test did not pass" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\Calcium Pipeline.lnk")) { throw "no Desktop shortcut" }
      - name: Upload the install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-log
          path: C:\CalciumPipeline\install_log.txt

  macos:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer exactly as the guide says
        run: bash INSTALL_MAC.sh
      - name: Upload the install log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-install-log
          path: ~/CalciumPipeline/install_log.txt
      - name: Diagnose cell detection if the self-test failed
        if: failure()
        run: |
          PY=~/CalciumPipeline/conda/envs/suite2p/bin/python
          cd ~/CalciumPipeline/code
          $PY - <<'PYEOF'
          import sys, subprocess, numpy as np, tifffile, torch, platform
          sys.path.insert(0, "install"); import self_test
          subprocess.run([sys.executable, "-c", self_test.MOVIE_SNIPPET, "/tmp/diag.tif"], check=True)
          mov = tifffile.imread("/tmp/diag.tif").astype(np.float32)
          mean = mov.mean(0)
          print("machine", platform.machine(), platform.processor(), "| torch", torch.__version__,
                "| threads", torch.get_num_threads(), "| mps", torch.backends.mps.is_available())
          print("mean image min/max", float(mean.min()), float(mean.max()), "finite", bool(np.isfinite(mean).all()))
          from cellpose import models
          for gpu in (False, True):
              m = models.CellposeModel(gpu=gpu)
              masks = m.eval(mean, diameter=12)[0]
              print("cellpose gpu=%s on raw mean image ->" % gpu, int(masks.max()), "cells (25 planted)")
          PYEOF
          find /var/folders -path "*cnp_selftest*" -name "*.npy" 2>/dev/null | head -20
          for f in $(find /var/folders -path "*cnp_selftest*/plane0/reg_outputs.npy" 2>/dev/null); do
            $PY -c "import numpy as np,sys; r=np.load(sys.argv[1],allow_pickle=True).item(); mi=r.get('meanImg'); print('registered meanImg', None if mi is None else (float(np.nanmin(mi)), float(np.nanmax(mi)), int(np.isnan(mi).sum()),'NaNs')); print('keys', list(r)[:30])" "$f"
          done
